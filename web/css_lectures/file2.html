<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        h1 {
            color: darkgray
        }
        .information {
            color: green;
            background-color: yellow;
            padding: 8px 4px 5px 12px;
            margin: 8px 4px 5px 12px
        }
        .paragraph {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Internal style type</h1>
    <div class="information">
        Padding: space inside element is called padding <br>
        Margin: space outside the element is called margin
    </div>
    <div class="paragraph">
        Some text in this area
    </div>

</body>
</html>
