<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Forms (Student registration)</h1>
    <!-- 
    Login
    Signup
    Forgot password form / Reset passowrd form
    Booking
    Appointment
    Add Student / Employee / User / Admin
    -->

    <!-- input types -->
     <!-- 
        text, search, range, email, password, number, date, datetime-local, file, color, select, radio, checkbox
        textarea
        button : button, submit, reset
     -->

    
    <form>

        <fieldset>
            <legend>Account</legend>
            <div>
                <label>Email address</label>
                <input type="email" placeholder="Enter email" />
            </div>

            <div>
                <label>Password</label>
                <input type="password" placeholder="Enter strong password" />
            </div>
        </fieldset>

        <fieldset>
            <legend>Personal</legend>
            <div>
                <label>Full name</label>
                <input type="text" placeholder="Enter name" />
            </div>

            <div>
                <label>DOB</label>
                <input type="date" />
            </div>
            
            <div>
                <label>Photo</label>
                <input type="file" accept=".png" />
            </div>
            
            <div>
                <label>Contact</label>
                <input type="number" placeholder="Enter phone number" />
            </div>

            <div>
                <label>Gender</label> <br />
                
                <input type="radio" id="male" name="std-reg" />
                <label for="male">Male</label>
                
                <input type="radio" id="female" name="std-reg" />
                <label for="female">Female</label>
            </div>
        </fieldset>

        <div>
            <label>Section color</label>
            <input type="color" />
        </div>
        
        <div>
            <label>Area of interest</label> <br />
            
            <input type="checkbox" id="web" />
            <label for="web">Web developement</label>
            
            <input type="checkbox" id="it" />
            <label for="it">IT</label>

            <input type="checkbox" id="gd" />
            <label for="gd">Graphic designing</label>
            
            <input type="checkbox" id="ve" />
            <label for="ve">Video editing</label>
        </div>

        <div>
            <label>Shifting time</label>
            <select>
                <option selected disabled>--- Select Any ---</option>
                <option>Morning</option>
                <option>Afternoon</option>
                <option>Evening</option>
            </select>
        </div>

        <div>
            <label>Address</label>
            <textarea rows="3" cols="30" placeholder="Enter your postal address"></textarea>
        </div>

        <div>
            <button>Register</button> | <input type="submit" value="Register"> | <input type="reset" value="Reset">
        </div>
    </form>

</body>
</html>
