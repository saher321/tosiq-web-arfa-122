<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Html Table</h2>
    <table border="1" cellspacing="0" cellpadding="15">
       <tr>
        <td>1</td>
        <td colspan="2">2</td>
       </tr>
       <tr>
        <td>4</td>
        <td rowspan="2">5</td>
        <td>6</td>
       </tr>
       <tr>
        <td>7</td>
        <td>9</td>
       </tr>
    </table>
    <hr />






    <table border="1" cellspacing="0" cellpadding="15">

        </tr>

            <td rowspan="2">4</td>

            <td>6</td>
        </tr>
        <tr>
            <!-- <td>7</td> -->
            <td>8</td>
            <td>9</td>
        </tr>
    </table>

    <table border="1" cellspacing="0" cellpadding="15" width="100%">

</html>
