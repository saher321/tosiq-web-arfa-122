<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Html Table</h2>

    <table border="1" cellspacing="0" cellpadding="15" width="100%">
        <thead>
            <tr>
                <th>Sr#</th>
                <th>Product name</th>
                <th>Price</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>101</td>
                <td>Notebook</td>
                <td>500</td>
                <td>In stock</td>
            </tr>
            <tr>
                <td>102</td>
                <td>School bag</td>
                <td>2000</td>
                <td>Low stock</td>
            </tr>
        </tbody>
    </table>

    table>tr*20>td*20

</body>
</html>
