<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Forms (Student registration)</h1>
    <!-- 
    Login
    Signup
    Forgot password form / Reset passowrd form
    Booking
    Appointment
    Add Student / Employee / User / Admin
    -->

    <!-- input types -->
     <!-- 
        text, search, range, email, password, number, date, datetime-local, file, color, select, radio, checkbox
        textarea
     -->

    
    <form>
        <div>
            <label>Full name</label>
            <input type="text" placeholder="Enter name" />
        </div>

        <div>
            <label>Email address</label>
            <input type="email" placeholder="Enter email" />
        </div>

        <div>
            <label>Password</label>
            <input type="password" placeholder="Enter strong password" />
        </div>

        <div>
            <label>DOB</label>
            <input type="date" />
        </div>
        
        <div>
            <label>Photo</label>
            <input type="file" accept=".png" />
        </div>
        
        <div>
            <label>Contact</label>
            <input type="number" placeholder="Enter phone number" />
        </div>

        <div>
            <label>Section color</label>
            <input type="color" />
        </div>

        
        <div>
            <label>Gender</label> <br />
            
            <input type="radio" name="std-reg" />
            <label for="">Male</label>
            
            <input type="radio" name="std-reg" />
            <label for="">Female</label>
        </div>
    </form>

</body>
</html>
