<html>
<head>
    <title>Document</title>
</head>
<body>

    <h3>Un-ordered list</h3>
    <ul type="circle">
        <li>Fruits</li>
        <li>Mobile</li>
        <li>Shoes</li>
    </ul>

    <h3>Ordered list</h3>
    <ol>
        <li>Fruits</li>
        <li>Mobile</li>
        <li>Shoes</li>
    </ol>

    <hr />
    Before text <h2>Heading tag is block tag</h2> After text <br />
    <!-- ins, em, del, strong, small, sub, sup, listing -->
    This is dummy text <br />
    <ins>This is underlined text</ins> <br />
    <em>This is italic tag</em> <br />
    <del>This is deleted tag</del> <br />
    <small>This is deleted tag</small> <br />
    <strong>This is important text</strong> <br />
    <!-- super script -->
    X<sup>2</sup>Y + Z<sup>3</sup>  <br />
    <!-- sub script -->
    H<sub>2</sub>SO<sub>4</sub>
</body>
</html>
